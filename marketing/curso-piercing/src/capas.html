<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capas Plantão Piercing</title>
<link rel="stylesheet" href="fonts/local-fonts.css">
<style>
  /* Post 1080x1350 (4:5). Paleta: vermelho sangue + preto. */
  :root {
    --preto: #070404;
    --preto-2: #120808;
    --sangue: #8e0710;        /* blocos, pílulas */
    --sangue-vivo: #d8141f;   /* texto vermelho sobre preto */
    --osso: #f3ece9;          /* texto principal */
    --cinza: #bba9a7;         /* subtítulo */
    --cinza-2: #7d6866;       /* fonte, rodapé */
    --display: 'Unbounded', 'Arial Black', sans-serif;
    --condensada: 'Anton', 'Impact', sans-serif;
    --texto: 'Archivo', 'Arial', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #222; }
  .post { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--preto); color: var(--osso); font-family: var(--texto); }
  .foto { position: absolute; inset: 0 0 auto 0; height: 960px; background-size: cover; background-position: center top; }
  .foto::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(7,4,4,.55) 0%, rgba(7,4,4,0) 18%, rgba(7,4,4,0) 46%, rgba(7,4,4,.85) 78%, var(--preto) 100%); }
  .grao { position: absolute; inset: 0; background-image: url('grao.png'); opacity: .16; mix-blend-mode: screen; pointer-events: none; }
  .layout-manchete .foto { height: 800px; background-position: center top; }
  .layout-manchete .foto::after { background: linear-gradient(180deg, rgba(7,4,4,.55) 0%, rgba(7,4,4,0) 16%, rgba(7,4,4,0) 66%, rgba(7,4,4,.8) 88%, var(--preto) 100%); }
  .brilho { position: absolute; inset: 0; background: radial-gradient(70% 50% at 50% 30%, rgba(142,7,16,.55), rgba(7,4,4,0) 70%); }

  .topo { position: absolute; top: 56px; left: 64px; right: 64px; display: flex; align-items: center; gap: 18px; }
  .live { display: inline-flex; align-items: center; gap: 12px; background: var(--sangue); color: var(--osso); font: 800 24px/1 var(--texto); letter-spacing: .14em; padding: 14px 20px 13px; }
  .live i { width: 12px; height: 12px; border-radius: 50%; background: var(--osso); box-shadow: 0 0 0 5px rgba(243,236,233,.25); }
  .topico { font: 500 22px/1.2 var(--mono); letter-spacing: .08em; color: var(--osso); text-shadow: 0 1px 8px rgba(0,0,0,.6); }

  .base { position: absolute; left: 64px; right: 64px; bottom: 64px; display: flex; flex-direction: column; align-items: center; gap: 26px; text-align: center; }
  .perfil { display: flex; align-items: center; gap: 12px; font: 600 26px/1 var(--texto); color: var(--osso); }
  .perfil .marca { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--sangue-vivo); display: grid; place-items: center; font: 900 15px/1 var(--display); color: var(--osso); background: var(--preto); }
  h1 { font: 900 64px/1.06 var(--display); text-transform: uppercase; letter-spacing: -.01em; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--sangue-vivo); }
  h1 b { font-weight: 900; background: var(--sangue); color: var(--osso); padding: 0 .16em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .sub { font: 600 29px/1.3 var(--texto); color: var(--cinza); max-width: 860px; text-wrap: balance; }
  .rodape { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 20px; }
  .fonte { font: 500 18px/1.3 var(--mono); color: var(--cinza-2); letter-spacing: .04em; text-align: left; }
  .cta { display: inline-flex; align-items: center; gap: 14px; flex: none; }
  .cta span { background: var(--sangue); color: var(--osso); font: 800 21px/1 var(--texto); letter-spacing: .18em; padding: 17px 26px 16px; border-radius: 40px; }
  .cta i { width: 52px; height: 52px; border-radius: 50%; background: var(--sangue); display: grid; place-items: center; font: 800 26px/1 var(--texto); font-style: normal; color: var(--osso); }

  /* layout tipográfico */
  .tipo .base { top: 170px; justify-content: flex-end; }
  .big { font: 400 300px/.9 var(--condensada); margin-bottom: 6px; color: var(--sangue-vivo); letter-spacing: -.01em; text-transform: uppercase; white-space: nowrap; }
  .big small { font-size: .38em; color: var(--osso); margin-left: .08em; }
  .regua { width: 120px; height: 8px; background: var(--sangue-vivo); }

  /* slides internos */
  .slide .base { top: 150px; justify-content: center; align-items: flex-start; text-align: left; gap: 34px; }
  .slide .num { font: 400 150px/.8 var(--condensada); color: var(--sangue-vivo); }
  .slide p { font: 800 66px/1.14 var(--texto); color: var(--osso); text-wrap: pretty; }
  .slide p em { font-style: normal; color: var(--sangue-vivo); }
  .slide .rodape { position: absolute; left: 64px; right: 64px; bottom: 56px; width: auto; }
  .slide .pag { font: 500 20px/1 var(--mono); color: var(--cinza-2); letter-spacing: .1em; }
</style>
</head>
<body>
<div id="palco"></div>
<script>
  const params = new URLSearchParams(location.search);
  const marca = (s) => s
    .replace(/\[([^\]]+)\]/g, '<b>$1</b>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>');

  function topo(c) {
    return `<div class="topo"><span class="live"><i></i>${c.tag}</span><span class="topico">${c.topico}</span></div>`;
  }
  function rodape(c) {
    const cta = c.cta || 'ARRASTE PARA O LADO';
    return `<div class="rodape"><span class="fonte">FONTE: ${c.fonte}</span><span class="cta"><span>${cta}</span><i>→</i></span></div>`;
  }
  const perfil = `<div class="perfil"><span class="marca">BP</span>@seu.perfil</div>`;

  function capa(c) {
    if (c.layout === 'foto' || c.layout === 'manchete') {
      return `<div class="post layout-${c.layout}"><div class="foto" style="background-image:url('../fotos/${c.foto}.jpg')"></div><div class="grao"></div>${topo(c)}
        <div class="base">${perfil}<h1>${marca(c.head)}</h1><p class="sub">${c.sub}</p>${rodape(c)}</div></div>`;
    }
    return `<div class="post tipo"><div class="brilho"></div><div class="grao"></div>${topo(c)}
      <div class="base"><div class="big">${c.big}</div><div class="regua"></div>${perfil}<h1>${marca(c.head)}</h1><p class="sub">${c.sub}</p>${rodape(c)}</div></div>`;
  }

  function slide(c, i) {
    const total = c.slides.length;
    const txt = c.slides[i];
    const ultimo = i === total - 1;
    const corpo = ultimo
      ? `<p>Curso de <em>Body Piercing</em> pra iniciantes e profissionais.</p><p style="font-size:44px;color:var(--cinza)">R$250 ou 12x. Link na bio.</p>`
      : `<p>${marca(txt)}</p>`;
    return `<div class="post slide"><div class="brilho" style="opacity:.55"></div><div class="grao"></div>
      <div class="base"><div class="num">${String(i + 1).padStart(2, '0')}</div><div class="regua"></div>${corpo}</div>
      <div class="rodape">${perfil}<span class="pag">${i + 1}/${total}</span></div></div>`;
  }

  async function montar() {
    const dados = await (await fetch('campanha.json')).json();
    const c = dados.carrosseis.find(x => x.id === params.get('id'));
    const s = params.get('slide');
    document.getElementById('palco').innerHTML = s ? slide(c, +s) : capa(c);
    await document.fonts.ready;
    // encolhe o número grande até caber na largura
    const big = document.querySelector('.big');
    if (big) {
      let tb = 300;
      while (big.scrollWidth > 940 && tb > 120) { tb -= 6; big.style.fontSize = tb + 'px'; }
    }
    // encolhe o título até caber
    const h1 = document.querySelector('h1');
    const base = document.querySelector('.base');
    if (h1) {
      let tam = 64;
      const limite = { foto: 470, manchete: 300 }[c.layout] || 400;
      while (h1.offsetHeight > limite && tam > 40) { tam -= 2; h1.style.fontSize = tam + 'px'; }
    }
    const p = document.querySelector('.slide p');
    if (p) {
      let tam = 66;
      while (base.scrollHeight > base.clientHeight && tam > 36) { tam -= 2; p.style.fontSize = tam + 'px'; }
    }
    await document.fonts.ready;
    document.body.dataset.pronto = '1';
  }
  montar();
</script>
</body>
</html>
